name: KaShim [LightWeight] - Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kashim:
    name: Validate and package shaderpack
    runs-on: ubuntu-latest
    steps:
      - name: Validate and package in one step
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p source
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/zipball/${GITHUB_SHA}" \
            -o source.zip
          unzip -q source.zip -d source
          cd "$(find source -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          echo "== Checking required shaderpack files =="
          test -f README.md
          test -f shaders.properties
          for file in shaders/composite.vsh shaders/composite.fsh shaders/final.vsh shaders/final.fsh; do
            test -s "$file"
            grep -Eq 'void[[:space:]]+main[[:space:]]*\(' "$file"
          done

          echo "== Checking Iris settings =="
          grep -q 'GODRAY_STRENGTH' shaders.properties
          grep -q 'GODRAY_SAMPLES' shaders.properties
          grep -q 'GODRAY_STRENGTH' shaders/composite.fsh
          grep -q 'GODRAY_SAMPLES' shaders/composite.fsh

          echo "== Checking lightweight effects =="
          grep -Eiq 'ray|godray|sunPosition|moonPosition' shaders/composite.fsh
          if grep -RniE 'motion[ _-]?blur|depth[ _-]?of[ _-]?field|path[ _-]?tracing' shaders; then
            echo "::error::Unexpected heavyweight post-processing found."
            exit 1
          fi

          echo "== Creating ZIP package =="
          mkdir -p 'dist/KaShim [LightWeight]/shaders'
          cp README.md 'dist/KaShim [LightWeight]/README.md'
          cp shaders.properties 'dist/KaShim [LightWeight]/shaders.properties'
          cp shaders/*.vsh shaders/*.fsh 'dist/KaShim [LightWeight]/shaders/'
          (cd dist && zip -r 'KaShim-LightWeight.zip' 'KaShim [LightWeight]' && unzip -t 'KaShim-LightWeight.zip')

          {
            echo "## KaShim [LightWeight] - Quality Report"
            echo
            echo "- [x] Required files and shader entry points"
            echo "- [x] Iris settings references"
            echo "- [x] Lightweight effects audit"
            echo "- [x] ZIP package created and validated"
            echo
            echo "> Static checks do not replace an in-game test with Iris and Sodium."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SUCCESS: KaShim-LightWeight.zip was built and validated."

      - name: Upload downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KaShim-LightWeight
          path: source/*/dist/KaShim-LightWeight.zip
          if-no-files-found: error
          retention-days: 30
